<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">🏫</span>
      <div>
        <h1>GuardPlan</h1>
        <span class="brand-tag">Optimizador Quincenal de Guardias Escolares</span>
      </div>
    </div>

    <nav class="nav-bar">
      <button
        class="nav-tab"
        routerLink="/teachers"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">👨‍🏫</span> Claustro y Horario Base
      </button>

      <button
        class="nav-tab"
        routerLink="/calendars"
        routerLinkActive="active"
      >
        <span class="nav-icon">🗓️</span> Calendarios
      </button>

      <button
        class="nav-tab"
        routerLink="/absences"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">📝</span> Registro de Ausencias
      </button>

      <button
        class="nav-tab"
        routerLink="/history"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">📚</span> Historial de sustituciones
      </button>

      <button
        class="nav-tab"
        routerLink="/guards"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"

      >
        <span class="nav-icon">📊</span> Cuadrante de Guardias
      </button>

    </nav>
  </header>

  <main class="content-body">
    <router-outlet></router-outlet>
  </main>
</div>

<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-5h6v5M8 10h.01M12 10h.01M16 10h.01"/>
        </svg>
      </span>
      <div>
        <h1>GuardPlan</h1>
      </div>
    </div>

    <nav class="nav-bar">
      <button
        class="nav-tab"
        routerLink="/teachers"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="3"/><path d="M5 21a7 7 0 0 1 14 0M4 4h4M16 4h4M6 4v4M18 4v4"/></svg></span> Claustro y Horario Base
      </button>

      <button
        class="nav-tab"
        routerLink="/calendars"
        routerLinkActive="active"
      >
        <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg></span> Calendarios
      </button>

      <button
        class="nav-tab"
        routerLink="/absences"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12a2 2 0 0 1 2 2v16H4V5a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span> Registro de Ausencias
      </button>

      <button
        class="nav-tab"
        routerLink="/history"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h13v17H6a2 2 0 0 0-2 2V5Z"/><path d="M4 20a2 2 0 0 1 2-2h13M8 7h7M8 11h7"/></svg></span> Historial de sustituciones
      </button>

      <button
        *ngIf="false"
        class="nav-tab"
        routerLink="/guards"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"

      >
        <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h17"/><path d="m7 16 4-5 3 2 5-7"/></svg></span> Cuadrante de Guardias
      </button>
    </nav>
  </header>

  <main class="content-body">
    <router-outlet></router-outlet>
  </main>
</div>

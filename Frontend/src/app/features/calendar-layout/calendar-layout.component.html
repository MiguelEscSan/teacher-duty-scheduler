<section class="calendar-view">
  <div class="calendar-tabs" role="tablist" aria-label="Calendarios">
    <button
      class="calendar-tab"
      [class.active]="activeTab === 'duty'"
      [attr.aria-selected]="activeTab === 'duty'"
      (click)="activeTab = 'duty'"
      role="tab"
    >
      <span class="nav-icon">🛡️</span> Guardias fijas
    </button>
    <button
      class="calendar-tab"
      [class.active]="activeTab === 'short-term'"
      [attr.aria-selected]="activeTab === 'short-term'"
      (click)="activeTab = 'short-term'"
      role="tab"
    >
      <span class="nav-icon">🔄</span> Sustituciones cortas
    </button>
  </div>

  <app-duty-calendar *ngIf="activeTab === 'duty'"></app-duty-calendar>
  <app-short-term-calendar *ngIf="activeTab === 'short-term'"></app-short-term-calendar>
</section>

<section class="calendar-view">
  <div class="calendar-tabs" role="tablist" aria-label="Calendarios">
    <button
      class="calendar-tab"
      [class.active]="activeTab === 'duty'"
      [attr.aria-selected]="activeTab === 'duty'"
      (click)="activeTab = 'duty'"
      role="tab"
    >
      <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 20 6v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span> Guardias fijas
    </button>
    <button
      class="calendar-tab"
      [class.active]="activeTab === 'short-term'"
      [attr.aria-selected]="activeTab === 'short-term'"
      (click)="activeTab = 'short-term'"
      role="tab"
    >
      <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M18.5 12A7 7 0 0 0 6 7.5L4 9M5.5 12A7 7 0 0 0 18 16.5L20 15"/></svg></span> Sustituciones cortas
    </button>
  </div>

  <app-duty-calendar *ngIf="activeTab === 'duty'"></app-duty-calendar>
  <app-short-term-calendar *ngIf="activeTab === 'short-term'"></app-short-term-calendar>
</section>

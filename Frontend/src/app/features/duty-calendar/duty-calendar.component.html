<section class="calendar-card">
  <div class="section-heading">
    <div>
      <h2>Calendario de guardias fijas</h2>
      <p>Profesores asignados a cada franja semanal.</p>
    </div>
    <button class="btn-refresh" type="button" (click)="loadCalendar()" [disabled]="isLoading">
      ↻ Actualizar
    </button>
  </div>

  <div *ngIf="errorMessage" class="error-banner">⚠️ {{ errorMessage }}</div>
  <div *ngIf="isLoading" class="loading-label">Cargando calendario...</div>

  <div class="table-wrapper" *ngIf="!isLoading && !errorMessage">
    <table class="duty-calendar">
      <thead>
      <tr>
        <th class="period-column">Periodo / Hora</th>
        <th *ngFor="let day of days">
          {{ getDutySlot(day, 0)?.day_name || dayNames[day] }}
        </th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let hour of hours; let period = index">
        <td class="period-cell">
          <strong>P{{ period }}</strong>
          <span>{{ hour }}</span>
        </td>
        <td *ngFor="let day of days" class="duty-cell">
          <ng-container *ngIf="getDutyTeachers(day, period).length; else noDuty">
            <div *ngFor="let teacher of getDutyTeachers(day, period)" class="teacher-pill">
              👤 {{ teacher.name }}
            </div>
          </ng-container>
          <ng-template #noDuty>
            <span class="empty-slot">Sin asignar</span>
          </ng-template>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</section>
